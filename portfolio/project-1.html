<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Showcase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Six+Caps&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
        text-align: center;
      }
      .container {
        max-width: 800px;
        margin: 50px auto;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        font-family: "Six Caps", sans-serif;
        font-size: 2.5rem;
      }
      .project {
        margin: 20px 0;
        padding: 15px;
        border-bottom: 1px solid #ddd;
      }
      .project:last-child {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>My Projects</h1>
      <div class="project">
        <h2>Project Title 1</h2>
        <p>Description of the first project.</p>
      </div>
      <div class="project">
        <h2>Project Title 2</h2>
        <p>Description of the second project.</p>
      </div>
      <div class="project">
        <h2>Project Title 3</h2>
        <p>Description of the third project.</p>
      </div>
    </div>
  </body>
</html>
